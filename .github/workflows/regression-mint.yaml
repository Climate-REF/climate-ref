# Mint the native regression baselines.
#
# Minting executes a test case, uploads its curated native outputs to the Cloudflare R2 object store,
# and rewrites the committed `manifest.json` to record their digests.
# It requires credentials to access the object store.
# It is therefore manually dispatched and gated behind the `native-baselines` GitHub Environment, and never runs on fork pull-request code.
#
# Dispatch this workflow on the *feature branch* that should receive the regenerated manifest.
# The action commits the result back to that branch so the change is reviewed through its pull request,
# and so individual developers never need write credentials.
#
name: Regression baselines (mint)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider slug to mint"
        required: true
        default: "example"
      diagnostic:
        description: "Diagnostic slug(s), comma or space separated (optional; all diagnostics if blank)"
        required: false
        default: ""
      test_case:
        description: "Test case name (optional; all cases if blank; needs a single diagnostic)"
        required: false
        default: ""
      bump_version:
        description: "Always increment test_case_version (it is bumped automatically when the committed bundle changes)"
        type: boolean
        default: false
      dry_run:
        description: "Preflight and preview only -- upload nothing, commit nothing"
        type: boolean
        default: false

# `contents` to commit the regenerated manifest/bundle back to the dispatched branch,
# `pull-requests` so the diff-report workflow can post to the branch's PR.
permissions:
  contents: write
  pull-requests: write

# Never cancel an in-flight mint: it performs object-store writes and a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mint:
    if: github.repository == 'Climate-REF/climate-ref'
    outputs:
      # Set once the mint loop has run, even when some diagnostics failed, so the report still covers the rest.
      minted: ${{ steps.mint.outputs.minted }}
    # Run on the self-hosted ARC runners.
    # They mount the persistent dataset, software, and intake-esgf caches.
    # This requires approval by a maintainer to be run.
    runs-on: "arc-climate-ref"
    environment: native-baselines
    defaults:
      run:
        shell: bash
    env:
      # Keep the cache-warming download steps from flooding the log with progress bars.
      TQDM_DISABLE: "1"
    steps:
      - name: Refuse to mint on the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Dispatch mint on a feature branch, not ${{ github.event.repository.default_branch }}."
          echo "Mint commits the regenerated manifest back to the branch; review it through a pull request."
          exit 1
      - name: Validate inputs
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          TEST_CASE: ${{ inputs.test_case }}
        run: |
          read -ra diagnostics <<< "${DIAGNOSTIC//,/ }"
          if [ -n "${TEST_CASE}" ] && [ "${#diagnostics[@]}" -gt 1 ]; then
            echo "::error::test_case needs a single diagnostic, but ${#diagnostics[@]} were given (${diagnostics[*]})."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Fetch sample data
        run: uv run ref datasets fetch-sample-data
      - name: Set up provider (environment + reference data)
        env:
          PROVIDER: ${{ inputs.provider }}
        # Provisions the provider's conda environment (where applicable) and its
        # reference-data registries. ILAMB/PMP/ESMValTool diagnostics read observational
        # reference data that is not part of the ESGF model fetch above; without this the
        # diagnostic fails to open its reference files during the mint run.
        run: uv run ref providers setup --provider "${PROVIDER}"
      - name: Restore test-case catalog paths
        env:
          PROVIDER: ${{ inputs.provider }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          TEST_CASE: ${{ inputs.test_case }}
        run: |
          # Scope the fetch to the dispatched diagnostics/test case so a single-case
          # mint does not re-fetch every case for the provider (cmip7 cases in
          # particular can stall on ESGF). Mirrors the mint step's argument handling.
          # Serial, because the runners share an intake-esgf cache whose download db is SQLite.
          read -ra diagnostics <<< "${DIAGNOSTIC//,/ }"
          if [ "${#diagnostics[@]}" -eq 0 ]; then diagnostics=(""); fi
          for diagnostic in "${diagnostics[@]}"; do
            args=(--provider "${PROVIDER}")
            if [ -n "${diagnostic}" ]; then args+=(--diagnostic "${diagnostic}"); fi
            if [ -n "${TEST_CASE}" ]; then args+=(--test-case "${TEST_CASE}"); fi
            uv run ref test-cases fetch "${args[@]}" || echo "::warning::test-case fetch incomplete for ${diagnostic:-all diagnostics}"
          done
      - name: Mint native baselines
        id: mint
        env:
          REF_NATIVE_STORE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          REF_NATIVE_STORE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PROVIDER: ${{ inputs.provider }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          TEST_CASE: ${{ inputs.test_case }}
          BUMP_VERSION: ${{ inputs.bump_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A failing diagnostic does not stop the others. The failures are reported by the last step.
          read -ra diagnostics <<< "${DIAGNOSTIC//,/ }"
          if [ "${#diagnostics[@]}" -eq 0 ]; then diagnostics=(""); fi
          : > "${RUNNER_TEMP}/failed-mints"
          for diagnostic in "${diagnostics[@]}"; do
            args=(--provider "${PROVIDER}")
            if [ -n "${diagnostic}" ]; then args+=(--diagnostic "${diagnostic}"); fi
            if [ -n "${TEST_CASE}" ]; then args+=(--test-case "${TEST_CASE}"); fi
            if [ "${BUMP_VERSION}" = "true" ]; then args+=(--bump-version); fi
            if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
            if ! uv run ref test-cases mint "${args[@]}"; then
              echo "::error::mint failed for ${diagnostic:-all diagnostics}"
              echo "${diagnostic:-all diagnostics}" >> "${RUNNER_TEMP}/failed-mints"
            fi
          done
          echo "minted=true" >> "${GITHUB_OUTPUT}"
      - name: Commit regenerated baselines
        if: ${{ !inputs.dry_run }}
        env:
          PROVIDER: ${{ inputs.provider }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the committed bundle, its manifest, and the input catalog.
          # The catalog.yaml is included because the mint regenerates it:
          #  datasets.hash (its _metadata.hash, recorded as the manifest's catalog_hash) is not reproducible across pandas versions,
          #  so the runner's value can differ from the developer-authored one.
          git add ':(glob)packages/**/test-data/**/manifest.json' \
                  ':(glob)packages/**/test-data/**/catalog.yaml' \
                  ':(glob)packages/**/test-data/**/regression/**'
          if git diff --cached --quiet; then
            echo "No baseline changes to commit; the native blobs were already current."
            exit 0
          fi
          scope="${DIAGNOSTIC//,/ }"
          git commit -m "chore(regression): mint native baselines for ${PROVIDER}${scope:+ (${scope})}"
          # Pushed with GITHUB_TOKEN, so GitHub will NOT start new workflow runs for this commit.
          # See docs/background/regression-baselines.md.
          #
          # The branch may have advanced (e.g. mint of another diagnostic).
          # Different diagnostics touch disjoint test-data paths, so the rebase does not conflict.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              echo "::error::rebase conflict while committing regenerated baselines"
              exit 1
            }
          done
          echo "::error::failed to push regenerated baselines after retries"
          exit 1
      - name: Fail if any diagnostic failed to mint
        if: ${{ !cancelled() && steps.mint.outputs.minted == 'true' }}
        run: |
          if [ -s "${RUNNER_TEMP}/failed-mints" ]; then
            echo "::error::Failed to mint: $(paste -sd, "${RUNNER_TEMP}/failed-mints")"
            exit 1
          fi

  report:
    needs: mint
    if: ${{ !cancelled() && !inputs.dry_run && needs.mint.outputs.minted == 'true' }}
    uses: ./.github/workflows/regression-diff-report.yaml
    with:
      base: ${{ github.event.repository.default_branch }}
