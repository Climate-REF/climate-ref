# Mint the native regression baselines.
#
# Minting uploads each test case's native outputs to the R2 object store and rewrites its `manifest.json`.
# It needs write credentials, so it is dispatched by hand behind the `native-baselines` environment.
# Dispatch it on the feature branch to update: the result is committed back to that branch for review.
#
name: Regression baselines (mint)
# Shows the inputs on the run page, so the approver can see what will be minted.
run-name: "Mint ${{ inputs.provider }} (${{ inputs.diagnostic || 'all diagnostics' }})${{ inputs.dry_run && ' [dry run]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider slug to mint"
        required: true
        default: "example"
      diagnostic:
        description: "Diagnostic slug(s), comma or space separated (optional; all diagnostics if blank)"
        required: false
        default: ""
      test_case:
        description: "Test case name (optional; all cases if blank; needs a single diagnostic)"
        required: false
        default: ""
      bump_version:
        description: "Always increment test_case_version (it is bumped automatically when the committed bundle changes)"
        type: boolean
        default: false
      dry_run:
        description: "Preflight and preview only -- upload nothing, commit nothing"
        type: boolean
        default: false

# `contents` to commit the regenerated manifest/bundle back to the dispatched branch,
# `pull-requests` so the diff-report workflow can post to the branch's PR.
permissions:
  contents: write
  pull-requests: write

# Never cancel an in-flight mint: it performs object-store writes and a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mint:
    if: github.repository == 'Climate-REF/climate-ref'
    outputs:
      # Set once the mint loop has run, even when some diagnostics failed, so the report still covers the rest.
      minted: ${{ steps.mint.outputs.minted }}
    # Run on the self-hosted ARC runners.
    # They mount the persistent dataset, software, and intake-esgf caches.
    # This requires approval by a maintainer to be run.
    runs-on: "arc-climate-ref"
    environment: native-baselines
    defaults:
      run:
        shell: bash
    env:
      TQDM_DISABLE: "1"
    steps:
      - name: Refuse to mint on the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Dispatch mint on a feature branch, not ${{ github.event.repository.default_branch }}."
          echo "Mint commits the regenerated manifest back to the branch; review it through a pull request."
          exit 1
      - name: Validate inputs
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          TEST_CASE: ${{ inputs.test_case }}
        run: |
          read -ra diagnostics <<< "${DIAGNOSTIC//,/ }"
          if [ -n "${TEST_CASE}" ] && [ "${#diagnostics[@]}" -gt 1 ]; then
            echo "::error::test_case needs a single diagnostic, but ${#diagnostics[@]} were given (${diagnostics[*]})."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Fetch sample data
        run: uv run ref datasets fetch-sample-data
      - name: Set up provider (environment + reference data)
        env:
          PROVIDER: ${{ inputs.provider }}
        # Diagnostics read observational reference data that the ESGF fetch does not provide.
        run: uv run ref providers setup --provider "${PROVIDER}"
      - name: Fetch and mint each diagnostic
        id: mint
        env:
          REF_NATIVE_STORE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          REF_NATIVE_STORE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PROVIDER: ${{ inputs.provider }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          TEST_CASE: ${{ inputs.test_case }}
          BUMP_VERSION: ${{ inputs.bump_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Serial, because the runners share an intake-esgf cache backed by SQLite.
          # A blank input becomes one pass over every diagnostic of the provider.
          read -ra diagnostics <<< "${DIAGNOSTIC//,/ }"
          if [ "${#diagnostics[@]}" -eq 0 ]; then diagnostics=(""); fi

          failed=()
          for diagnostic in "${diagnostics[@]}"; do
            name="${diagnostic:-all diagnostics}"
            args=(--provider "${PROVIDER}")
            if [ -n "${diagnostic}" ]; then args+=(--diagnostic "${diagnostic}"); fi
            if [ -n "${TEST_CASE}" ]; then args+=(--test-case "${TEST_CASE}"); fi

            uv run ref test-cases fetch "${args[@]}" || echo "::warning::test-case fetch incomplete for ${name}"

            if [ "${BUMP_VERSION}" = "true" ]; then args+=(--bump-version); fi
            if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
            uv run ref test-cases mint "${args[@]}" || failed+=("${name}")
          done

          # Set even on failure, so the diagnostics that did mint are still committed and reported.
          echo "minted=true" >> "${GITHUB_OUTPUT}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to mint: ${failed[*]}"
            exit 1
          fi
      - name: Commit regenerated baselines
        if: ${{ !cancelled() && !inputs.dry_run && steps.mint.outputs.minted == 'true' }}
        env:
          PROVIDER: ${{ inputs.provider }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # catalog.yaml too, because its hash differs between pandas versions and mint rewrites it.
          git add ':(glob)packages/**/test-data/**/manifest.json' \
                  ':(glob)packages/**/test-data/**/catalog.yaml' \
                  ':(glob)packages/**/test-data/**/regression/**'
          if git diff --cached --quiet; then
            echo "No baseline changes to commit; the native blobs were already current."
            exit 0
          fi
          scope="${DIAGNOSTIC//,/ }"
          git commit -m "chore(regression): mint native baselines for ${PROVIDER}${scope:+ (${scope})}"

          # Pushes with GITHUB_TOKEN do not start workflows, so the PR gate does not rerun.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  report:
    needs: mint
    if: ${{ !cancelled() && !inputs.dry_run && needs.mint.outputs.minted == 'true' }}
    uses: ./.github/workflows/regression-diff-report.yaml
    with:
      base: ${{ github.event.repository.default_branch }}
