channels:
  - conda-forge
  - nodefaults

dependencies:
  # 0.25 raises "getX called on empty Point" in pcolormesh (SciTools/cartopy#2640).
  - cartopy >=0.26
  - cf-units
  - dask
  - esmvaltool-base
  - iris
  - mapgenerator
  # 3.11 lays out the monitor multi-panel figures differently, moving every plot baseline.
  - matplotlib-base <3.11
  - numpy
  - pandas
  # The compiled dependencies are built for the regular ABI, not the free-threaded cp314t one.
  - python_abi * *_cp314
  - requests
  - scikit-learn
  - scipy
  - seaborn
  - yaml
