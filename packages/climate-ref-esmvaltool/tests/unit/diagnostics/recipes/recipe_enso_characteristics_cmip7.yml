      end_latitude: 5.0
    anomalies:
      period: monthly
    meridional_statistics:
      operator: mean
  enso_asymmetry:
    custom_order: true
    convert_units:
      units: degC
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 120.0
      end_longitude: 290.0
      start_latitude: -15.0
      end_latitude: 15.0
    anomalies:
      period: monthly
diagnostics:
  diagnostic_metrics:
    description: run preprocessors on variables for ENSO metrics
    variables:
      tos_seas_asym:
        short_name: tos
        preprocessor: enso_seas_asym
      tos_amp:
        short_name: tos
        preprocessor: enso_amplitude
      tos_patdiv1:
        short_name: tos
        preprocessor: ssta_dec_area
      tos_lifdur1:
        short_name: tos
        preprocessor: ssta_ninoarea
      tos_lifdurdiv2:
        short_name: tos
        preprocessor: ssta_meridional
      tos_pat2:
        short_name: tos
        preprocessor: ssta_pattern2
      tos_pat_map:
        short_name: tos
        mip: ocean
        preprocessor: ssta_pattern_map
    scripts:
      metrics_script:
        script: enso_metrics/enso_diag1metrics.py
      pattern_script:
        script: enso_metrics/enso_divedowns/pattern_9.py
      lifecycle_script:
        script: enso_metrics/enso_divedowns/lifecycle_10.py
      durationdiversity_script:
        script: enso_metrics/enso_divedowns/durdiver_1415.py
  diagnostic_seas_skew_amp:
    description: Assymetry, amplitude, seasonality divedowns
    variables:
      tos_seas_area:
        short_name: tos
        mip: ocean
        preprocessor: enso_seas_2
      tos_seas_meri:
        short_name: tos
        mip: ocean
        preprocessor: enso_seas_3
      tos_seas_split:
        short_name: tos
        mip: ocean
        preprocessor: enso_seas_4
      tos_amp:
        short_name: tos
        mip: ocean
        preprocessor: enso_amp3
      tos_asym:
        short_name: tos
        mip: ocean
        preprocessor: enso_asymmetry
    scripts:
      seas_asym_amp_script:
        script: enso_metrics/enso_divedowns/ampseasskew_1113.py
