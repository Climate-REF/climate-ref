  enso_seas_3:
    custom_order: true
    convert_units:
      units: degC
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 130.0
      end_longitude: 280.0
      start_latitude: -5.0
      end_latitude: 5.0
    anomalies:
      period: monthly
    meridional_statistics:
      operator: mean
    climate_statistics:
      operator: std_dev
      period: monthly
  enso_seas_4:
    custom_order: true
    convert_units:
      units: degC
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 150.0
