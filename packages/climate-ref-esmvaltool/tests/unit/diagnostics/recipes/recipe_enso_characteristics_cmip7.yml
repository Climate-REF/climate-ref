  ssta_seasamp:
    custom_order: true
    convert_units:
      units: degC
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 150.0
      end_longitude: 280.0
      start_latitude: -5.0
      end_latitude: 5.0
    anomalies:
      period: monthly
  enso_amp3:
    custom_order: true
    convert_units:
      units: degC
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 120.0
      end_longitude: 280.0
      start_latitude: -15.0
      end_latitude: 15.0
    anomalies:
