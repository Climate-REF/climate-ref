documentation:
  title: 'Equilibrium Climate Sensitivity (ECS)

    '
  description: 'Calculate Equilibrium Climate Sensitivity (ECS) using linear regression
    following Gregory et al. (2004).

    '
  authors:
  - schlund_manuel
  maintainer:
  - schlund_manuel
  references:
  - gregory04grl
datasets:
- project: CMIP7
  activity: CMIP
  dataset: ACCESS-ESM1-6
  ensemble: r1i1p1f1
  exp: abrupt-4xCO2
  frequency: mon
  grid: g115
  institute: ACCESS-Consortium
  mip: atmos
  region: glb
  timerange: 0201/0350
- project: CMIP7
  activity: CMIP
  dataset: ACCESS-ESM1-6
  ensemble: r1i1p1f1
  exp: piControl
  frequency: mon
  grid: g115
  institute: ACCESS-Consortium
  mip: atmos
  region: glb
  timerange: 0201/0350
preprocessors:
  spatial_mean:
    area_statistics:
      operator: mean
diagnostics:
  ecs:
    description: Calculate ECS.
    variables:
      tas:
        branding_suffix: tavg-h2m-hxy-u
        preprocessor: spatial_mean
      rtnt:
        branding_suffix: tavg-u-hxy-u
        derive: true
        preprocessor: spatial_mean
    scripts:
      calculate:
        script: climate_metrics/ecs.py
        calculate_mmm: false
