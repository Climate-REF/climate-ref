documentation:
  title: Sea ice sensitivity
  description: 'Recipe for quantifying the sensitivity of sea ice to global warming.

    Siconc data is summed for each hemisphere and then compared to the

    change in globally meaned, annually meaned surface air temperature.

    In the northern hemisphere, September sea ice data is used.

    In the southern hemisphere, annual mean sea ice data is used.

    Two plots are produced for each hemisphere, one showing the gradient

    of the direct regression of sea ice area over temperature, and the

    other showing the two separate trends over time.

    '
  authors:
  - parsons_naomi
  - sellar_alistair
  - blockley_ed
  maintainer:
  - parsons_naomi
preprocessors:
  nh_total_area:
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: 0
      end_latitude: 90
    area_statistics:
      operator: sum
    convert_units:
      units: 1e6 km2
  sh_total_area:
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: -90
      end_latitude: 0
    area_statistics:
      operator: sum
    convert_units:
      units: 1e6 km2
  global_mean:
    area_statistics:
      operator: mean
  annual_mean:
    annual_statistics:
      operator: mean
      keep_group_coordinates: true
  extract_sept:
    extract_month:
      month: 9
  pp_arctic_sept_sea_ice:
    extract_month:
      month: 9
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: 0
      end_latitude: 90
    area_statistics:
      operator: sum
    convert_units:
      units: 1e6 km2
  pp_antarctic_avg_ann_sea_ice:
    annual_statistics:
      operator: mean
      keep_group_coordinates: true
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: -90
      end_latitude: 0
    area_statistics:
      operator: sum
    convert_units:
      units: 1e6 km2
  pp_avg_ann_global_temp:
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean
      keep_group_coordinates: true
