documentation:
  title: 'Zero Emission Commitment (ZEC)

    '
  description: 'Calculate Zero Emission Commitment (ZEC) temperature.

    '
  authors:
  - gier_bettina
  maintainer:
  - gier_bettina
  references:
  - macdougall20
  domains:
  - global
  realms:
  - atmos
preprocessors:
  spatial_mean:
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean
      keep_group_coordinates: true
  anomaly_base:
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
diagnostics:
  zec:
    description: Calculate ZEC for all available models.
    variables:
      tas_base:
        short_name: tas
        preprocessor: anomaly_base
        additional_datasets:
        - project: CMIP7
          activity: C4MIP
          branding_suffix: tavg-h2m-hxy-u
          dataset: CanESM5-1
          ensemble: r1i1p2f1
          exp: esm-flat10
          frequency: mon
          grid: g120
          institute: CCCma
          mip: atmos
          region: glb
          timerange: 1940/1959
      tas:
        preprocessor: spatial_mean
        additional_datasets:
        - project: CMIP7
          activity: C4MIP
          branding_suffix: tavg-h2m-hxy-u
          dataset: CanESM5-1
          ensemble: r1i1p2f1
          exp: esm-flat10-zec
          frequency: mon
          grid: g120
          institute: CCCma
          mip: atmos
          region: glb
          timerange: 1950/2049
    scripts:
      zec:
        script: climate_metrics/zec.py
        zec_year: 50
        experiments:
          reference:
          - esm-flat10
          simulation:
          - esm-flat10-zec
