realm: land
region_masks: ilamb-regions

gpp-WECANN:
  version: 3
  sources:
    gpp:
      obs_source: obs4ref
      source_id: WECANN-1-0
      variable_id: gpp
      grid_label: gn
      version: v20250902
  relationships:
    pr: obs4REF/NOAA-NCEI/GPCP-2-3/mon/pr/gn/v20210727/pr_mon_GPCP-2-3_PCMDI_gn_197901-201907.nc
    tas: ilamb/tas/CRU4.02/tas.nc
  variable_cmap: Greens

gpp-FLUXNET2015:
  version: 4
  sources:
    # Referenced by exact registry key rather than ingested facets
    # this file's source_id is spelled three different ways (https://github.com/Climate-REF/climate-ref/issues/784)
    gpp: obs4REF/Fluxnet/FLUXNET2015-1-0/mon/gpp/site/v20260202/gpp_mon_Fluxnet-2015-1-0_REF_site_19910101-20141231.nc
  variable_cmap: Greens

mrro-LORA:
  version: 3
  sources:
    mrro:
      obs_source: obs4ref
      source_id: LORA-1-0
      variable_id: mrro
      grid_label: gn
      version: v20250902
  variable_cmap: Blues

mrsos-WangMao:
  sources:
    mrsol: ilamb/mrsol/WangMao/mrsol_olc.nc
  # Model variables, most preferred first: a model is compared using the first one it publishes.
  # CMIP7 calls both `mrsol` and tells them apart by branding (tavg-d10cm-hxy-lnd, tavg-sl-hxy-lnd).
  model_variables:
  - Lmon.mrsos  # top 10 cm
  - Emon.mrsol  # all soil layers, compared at the top one (select_depth)
  transforms:
  - select_depth:
      value: 0
  - soil_moisture_to_vol_fraction
  variable_cmap: Blues
  test_cmip7:
    # Publishes both mrsol variants (mrsos and mrsol in CMIP6); the test case fetches the preferred one
    source_id: CanESM6-0-MR
    # r1i1p1f1-r5i1p1f1 cannot be pinned: ESGF indexes their fx fields without a base_id
    variant_label: r6i1p1f1

cSoil-HWSD2:
  version: 3
  sources:
    cSoil:
      obs_source: obs4ref
      source_id: HWSD-2-0
      variable_id: cSoil
      grid_label: gn
      version: v20250903
  variable_cmap: viridis

lai-AVH15C1:
  # The first execution needs the most memory, because it also coarsens the ~0.05 degree source.
  version: 5
  sources:
    lai:
      obs_source: obs4mips
      # No `version`: obs4mips fetches from ESGF, whose version facet is unprefixed
      # (e.g. 20260110), while the solve fixture stores it v-prefixed.
      # Omitting it lets the ESGF search resolve the latest and the solver match on source_id/variable_id/grid_label.
      source_id: NOAA-NCEI-LAI-AVHRR-5-0
      variable_id: lai
      grid_label: gn
  transforms:
  # NOAA-NCEI-LAI-AVHRR-5-0 is ~0.05 deg (5 km)
  # Coarsen the reference to a common grid before comparison.
  - climate_ref_coarsen_spatial:
      variable_id: lai
  variable_cmap: Greens

nbp-Hoffman:
  version: 3
  analyses:
  - nbp
  sources:
    nbp:
      obs_source: obs4ref
      source_id: Hoffman-1-0
      variable_id: nbp
      grid_label: gm
      version: v20251117
  transforms:
  - integrate_space:
      varname: nbp

snc-ESACCI:
  version: 3
  sources:
    snc:
      obs_source: obs4ref
      source_id: CCI-CryoClim-FSC-1
      variable_id: snc
      grid_label: gn
      version: v20250519

burntFractionAll-GFED:
  version: 3
  sources:
    burntFractionAll:
      obs_source: obs4ref
      source_id: GFED-5-0
      variable_id: burntFractionAll
      grid_label: gr
      version: v20260128
  test_source_id: CESM2
  test_cmip7:
    source_id: CanESM6-0-MR
    # r1i1p1f1-r5i1p1f1 cannot be pinned: ESGF indexes their fx fields without a base_id
    variant_label: r6i1p1f1

emp-GLEAMGPCP2.3:
  version: 3
  analysis_variable: emp
  sources:
    et: ilamb/evspsbl/GLEAMv3.3a/et.nc
    pr: obs4REF/NOAA-NCEI/GPCP-2-3/mon/pr/gn/v20210727/pr_mon_GPCP-2-3_PCMDI_gn_197901-201907.nc
  transforms:
  - select_time:
      vmin: 2000-01
      vmax: 2015-01
  # An expression is skipped when an input is missing or `emp` already exists,
  # so the first only applies to the reference (GLEAM `et`) and the second only to the model.
  - expression:
      expr: emp = et - pr
  - expression:
      expr: emp = evspsbl - pr
  # The model inputs E - P is computed from; both are needed.
  related_vars:
  - evspsbl
  - pr
