realm: ocean

thetao-WOA2023-surface:
  version: 3
  sources:
    # WOA-23 monthly climatology (2005-2022); surface field via select_depth.
    thetao:
      obs_source: obs4ref
      source_id: WOA-23
      variable_id: thetao
      grid_label: gn
      version: v20251024
  variable_cmap: Reds
  transforms:
  - select_depth:
      value: 0
  # Model variables, most preferred first: the surface field covers the reference period more often
  # and avoids loading the full 3D thetao.
  model_variables:
  - Omon.tos
  - Omon.thetao

so-WOA2023-surface:
  version: 3
  sources:
    # WOA-23 monthly climatology (2005-2022); surface field via select_depth.
    so:
      obs_source: obs4ref
      source_id: WOA-23
      variable_id: so
      grid_label: gn
      version: v20251024
  transforms:
  - select_depth:
      value: 0
  variable_cmap: YlGn
  # Model variables, most preferred first: the surface field covers the reference period more often
  # and avoids loading the full 3D so.
  model_variables:
  - Omon.sos
  - Omon.so

amoc-RAPID:
  version: 5
  analysis_variable: amoc
  analyses:
  - timeseries
  related_vars:
  - msftmz
  transforms:
  - climate_ref_msftmz_to_rapid
  sources:
    amoc:
      obs_source: obs4ref
      source_id: RAPID-2023-1a
      variable_id: msftmz
      grid_label: gm
      version: v20250902
  test_cmip7:
    xfail: No CMIP7 overturning streamfunction (msftm) is published yet
